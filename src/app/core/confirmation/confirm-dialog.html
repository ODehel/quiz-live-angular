{{title}}
<button data-testid="close" (click)="dialogRef.close(false)"><app-icon name="x" /></button>
<button data-testid="cancel" (click)="dialogRef.close(false)">{{cancelLabel}}</button>
<button data-testid="confirm" (click)="dialogRef.close(true)"><app-icon data-testid="confirm-icon" [name]="confirmIcon" />{{confirmLabel}}</button>
<app-icon data-testid="variant-icon" [name]="variantIcon" />
@if (message) {
<p data-testid="message">{{message}}</p>
}
