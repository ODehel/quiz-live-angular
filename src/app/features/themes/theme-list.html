<header class="page-header">
    <h1 class="page-title" data-testid="themes-title">Thèmes</h1>
    @if (page(); as list) {
        <span class="page-count" data-testid="theme-total">{{list.total}} au total</span>
    }
    <button class="btn-primary" data-testid="new-theme" (click)="openNewThemeDialog()">
        <app-icon name="plus" [size]="16" />Nouveau thème
    </button>
</header>
@if (page(); as list) {
    <div class="cards-grid">
        @for (theme of list.themes; track theme.id) {
            <article class="theme-card" data-testid="theme-card">
                <div class="theme-icon-wrap">
                    <app-icon name="folder-tree" [size]="22" />
                </div>
                <div class="theme-card-body">
                    <h2 class="theme-card-title" data-testid="theme-name">{{theme.name}}</h2>
                    <p class="theme-card-date" data-testid="theme-created">Créé le {{theme.createdAt | date:'dd/MM/yyyy'}}</p>
                    @if (theme.lastUpdatedAt) {
                        <p class="theme-card-date" data-testid="theme-updated">Modifié le {{theme.lastUpdatedAt | date:'dd/MM/yyyy'}}</p>
                    }
                </div>
            </article>
        }
    </div>
}
