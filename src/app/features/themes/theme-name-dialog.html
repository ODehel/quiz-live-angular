<div class="dialog-header">
    <div class="dialog-title" data-testid="title">Nouveau thème</div>
    <button class="dialog-close" data-testid="close" aria-label="Fermer" (click)="cancel()"><app-icon name="x" [size]="16" /></button>
</div>
<div class="dialog-body">
    <div class="field">
        <label class="field-label" for="name-field">Nom du thème</label>
        <input class="field-input" id="name-field" data-testid="name-field" type="text" cdkFocusInitial />
    </div>
</div>
<div class="dialog-footer">
    <button class="dialog-btn" data-testid="cancel" (click)="cancel()">Annuler</button>
</div>
