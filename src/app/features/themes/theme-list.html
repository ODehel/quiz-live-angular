<header class="page-header">
    <h1 class="page-title" data-testid="themes-title">Thèmes</h1>
    @if (page(); as list) {
        <span class="page-count" data-testid="theme-total">{{list.total}} au total</span>
    }
</header>
@if (page(); as list) {
    <div class="cards-grid">
        @for (theme of list.themes; track theme.id) {
            <article class="theme-card" data-testid="theme-card">
                <div class="theme-icon-wrap">
                    <app-icon name="folder-tree" [size]="22" />
                </div>
                <h2 class="theme-card-title" data-testid="theme-name">{{theme.name}}</h2>
            </article>
        }
    </div>
}
