{{dialogData.title}}
<button data-testid="close" (click)="cancel()"><app-icon name="x" /></button>
<button data-testid="cancel" (click)="cancel()">{{dialogData.cancelLabel}}</button>
<button data-testid="confirm" (click)="confirm()" [disabled]="dialogData.requireTyping"><app-icon data-testid="confirm-icon"
        [name]="confirmIcon" />{{dialogData.confirmLabel}}</button>
<app-icon data-testid="variant-icon" [name]="variantIcon" />
@if (dialogData.message) {
<p data-testid="message">{{dialogData.message}}</p>
}
@if (dialogData.contextRows?.length) {
<div data-testid="context-rows">
    @for (row of dialogData.contextRows; track row.key) {
    <div data-testid="context-row" [attr.data-tone]="row.tone">
        <span data-testid="context-key">{{row.key}}</span>
        <span data-testid="context-value">{{row.value}}</span>
    </div>
    }
</div>
}
@if (dialogData.requireTyping) {
<input data-testid="confirm-action-input" />
}
